<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EagleVision – Host</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ── Base ── */
    body { background: var(--bg, #0a0f1c); color: var(--text, #e8eaf6); font-family: 'Inter', sans-serif; margin: 0; overflow-y: auto; }

    /* ── Setup screen ── */
    #setup-screen {
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 1.5rem 1rem; gap: 1.25rem;
    }
    #setup-screen h1 { font-size: 1.6rem; margin: 0; text-align: center; }
    .setup-card {
      background: var(--surface, #141929);
      border: 1px solid var(--border, #2a3050);
      border-radius: 12px;
      padding: 1.25rem 1.25rem;
      width: 100%; max-width: 560px;
      display: flex; flex-direction: column; gap: 1rem;
      box-sizing: border-box;
    }
    .setup-card label { font-size: .85rem; color: var(--muted, #7c83a8); margin-bottom: .25rem; display: block; }
    .setup-card select, .setup-card input {
      width: 100%; padding: .65rem .8rem;
      background: var(--bg, #0a0f1c); color: var(--text, #e8eaf6);
      border: 1px solid var(--border, #2a3050); border-radius: 8px;
      font-size: 1rem; box-sizing: border-box;
      -webkit-appearance: none; appearance: none;
    }
    #preview-video {
      width: 100%; border-radius: 8px; background: #000;
      aspect-ratio: 16/9; object-fit: cover;
    }
    .code-row { display: flex; align-items: center; gap: .6rem; }
    #session-code-display {
      flex: 1; padding: .6rem .8rem;
      background: var(--bg, #0a0f1c); color: var(--accent, #FFD700);
      border: 1px solid var(--border, #2a3050); border-radius: 8px;
      font-size: 1.4rem; font-weight: 700; letter-spacing: .15em; text-align: center;
    }
    #btn-regen {
      padding: .55rem 1rem; border-radius: 8px;
      border: 1px solid var(--border, #2a3050);
      background: transparent; color: var(--muted, #7c83a8);
      cursor: pointer; font-size: 1.1rem; flex-shrink: 0;
    }
    #btn-start {
      padding: .85rem; border-radius: 10px;
      background: var(--accent, #FFD700); color: #0a0f1c;
      border: none; font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: opacity .2s;
    }
    #btn-start:active { opacity: .75; }
    #setup-error { color: #f87171; font-size: .9rem; display: none; margin: 0; }

    /* ── Access gate ── */
    #gate-screen {
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 1.5rem 1rem; gap: 1.25rem;
    }
    #gate-screen h1 { font-size: 1.6rem; margin: 0; text-align: center; }
    #gate-screen p { font-size: .9rem; color: var(--muted, #7c83a8); margin: 0; text-align: center; }
    #gate-error { color: #f87171; font-size: .9rem; display: none; margin: 0; text-align: center; }
    @media (max-width: 640px) {
      #gate-screen { padding: 1rem .75rem; justify-content: flex-start; padding-top: 2.5rem; }
      #gate-screen h1 { font-size: 1.35rem; }
    }

    /* ── Session screen ── */
    #session-screen { display: none; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }

    /* Header */
    #session-header {
      display: flex; align-items: center; gap: .5rem;
      padding: .5rem .75rem;
      background: var(--surface, #141929);
      border-bottom: 1px solid var(--border, #2a3050);
      flex-shrink: 0;
      min-height: 48px;
    }
    #session-header .logo { font-weight: 800; font-size: 1rem; color: var(--accent, #FFD700); white-space: nowrap; }
    #hdr-code {
      font-weight: 700; font-size: 1rem; letter-spacing: .12em; white-space: nowrap;
      color: var(--accent, #FFD700);
      background: rgba(255,215,0,.08); border: 1px solid rgba(255,215,0,.2);
      padding: .2rem .6rem; border-radius: 6px;
    }
    .badge {
      padding: .2rem .5rem; border-radius: 999px;
      font-size: .7rem; font-weight: 600; white-space: nowrap;
    }
    .badge-socket { background: #1e3a2f; color: #4ade80; }
    .badge-socket.err { background: #3b1a1a; color: #f87171; }
    .badge-lk { background: #1a2a3b; color: #60a5fa; }
    .badge-lk.err { background: #3b1a1a; color: #f87171; }
    #hdr-viewers {
      margin-left: auto; font-size: .8rem; color: var(--muted, #7c83a8);
      white-space: nowrap; flex-shrink: 0;
    }
    #btn-end {
      padding: .35rem .75rem; border-radius: 8px;
      background: #7f1d1d; color: #fca5a5;
      border: none; cursor: pointer; font-size: .8rem; white-space: nowrap;
      min-height: 34px; flex-shrink: 0;
    }

    /* Main layout */
    #main-layout { display: flex; flex: 1; overflow: hidden; position: relative; }

    /* Activity bar — desktop: vertical left column */
    #activity-bar {
      width: 52px; background: var(--surface, #141929);
      border-right: 1px solid var(--border, #2a3050);
      display: flex; flex-direction: column; align-items: center;
      padding: .5rem 0; gap: .4rem; flex-shrink: 0;
      z-index: 10;
    }
    .ab-btn {
      width: 40px; height: 40px; border-radius: 8px;
      border: none; background: transparent;
      color: var(--muted, #7c83a8); cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    }
    .ab-btn svg { flex-shrink: 0; }
    .ab-label { font-size: .6rem; font-weight: 600; letter-spacing: .02em; display: none; }
    .ab-btn:hover, .ab-btn.active { background: var(--border, #2a3050); color: var(--text, #e8eaf6); }

    /* Side panel — desktop */
    #side-panel {
      width: 260px; background: var(--surface, #141929);
      border-right: 1px solid var(--border, #2a3050);
      display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0;
      transition: transform .25s ease;
    }
    .panel { display: none; flex-direction: column; flex: 1; overflow: hidden; }
    .panel.active { display: flex; }
    .panel-title {
      padding: .7rem 1rem .6rem; font-size: .8rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .08em;
      color: var(--muted, #7c83a8);
      border-bottom: 1px solid var(--border, #2a3050);
      display: flex; align-items: center; justify-content: space-between;
    }
    .panel-body { padding: .75rem; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: .5rem; }

    /* Roster */
    .roster-item {
      display: flex; align-items: center; gap: .5rem;
      padding: .45rem .5rem; border-radius: 6px;
      background: var(--bg, #0a0f1c);
    }
    .roster-avatar {
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--accent, #FFD700); color: #0a0f1c;
      display: flex; align-items: center; justify-content: center;
      font-size: .75rem; font-weight: 700; flex-shrink: 0;
    }
    .roster-name { flex: 1; font-size: .85rem; }
    .roster-kick {
      padding: .25rem .5rem; border-radius: 4px;
      background: #3b1a1a; color: #f87171;
      border: none; cursor: pointer; font-size: .8rem; min-height: 30px;
    }

    /* Controls panel */
    .ctrl-group { display: flex; flex-direction: column; gap: .4rem; }
    .ctrl-label { font-size: .75rem; color: var(--muted, #7c83a8); }
    .ctrl-btn {
      padding: .55rem .7rem; border-radius: 8px;
      border: 1px solid var(--border, #2a3050);
      background: transparent; color: var(--text, #e8eaf6);
      cursor: pointer; font-size: .85rem; text-align: left;
      min-height: 40px;
    }
    .ctrl-btn:active { background: var(--border, #2a3050); }
    .ctrl-btn.danger { border-color: #7f1d1d; color: #f87171; }
    .ctrl-btn.danger:active { background: #7f1d1d; }
    #instruction-input {
      width: 100%; padding: .55rem .6rem;
      background: var(--bg, #0a0f1c); color: var(--text, #e8eaf6);
      border: 1px solid var(--border, #2a3050); border-radius: 8px;
      font-size: .9rem; box-sizing: border-box; min-height: 40px;
    }

    /* Workspace */
    #workspace {
      flex: 1; display: flex; align-items: center; justify-content: center;
      background: #000; position: relative; overflow: hidden;
    }
    #host-canvas { max-width: 100%; max-height: 100%; display: block; aspect-ratio: 1/1; width: auto; height: auto; touch-action: none; }
    /* Framing mode: the canvas IS the crop — drag/pinch happens directly on
       it, so the accent ring + grab cursor are the only visual cue needed. */
    #workspace.framing-mode #host-canvas { outline: 3px solid var(--accent, #FFD700); outline-offset: -3px; cursor: grab; }
    #workspace.framing-mode #host-canvas:active { cursor: grabbing; }

    /* Panel backdrop (mobile) */
    #panel-backdrop {
      display: none;
      position: fixed; inset: 0; background: rgba(0,0,0,.5);
      z-index: 19;
    }

    /* ── Mobile layout ── */
    @media (max-width: 640px) {
      /* Header: single tight row — hide logo and status badges */
      #session-header { padding: .4rem .6rem; gap: .4rem; }
      #session-header .logo { display: none; }
      #badge-socket, #badge-lk { display: none; }

      /* Stack workspace above the tab bar in normal flow instead of pinning
         the bar with position:fixed — fixed elements anchor to the raw
         browser viewport, which on Android Chrome can render underneath
         the browser's own bottom toolbar / the OS nav bar, making the tab
         bar visible but untappable. Normal flow stays inside the properly
         dvh-sized container instead. */
      #main-layout { flex-direction: column; }

      #workspace { order: 1; flex: 1; min-height: 0; }

      /* Bottom tab bar */
      #activity-bar {
        order: 2;
        position: static;
        width: 100%; height: 58px; flex-shrink: 0;
        flex-direction: row; justify-content: space-around;
        padding: 0; gap: 0;
        border-right: none; border-top: 1px solid var(--border, #2a3050);
        z-index: 20; background: var(--surface, #141929);
      }
      .ab-btn { width: auto; flex: 1; height: 58px; border-radius: 0; }
      .ab-label { display: block; }

      /* Side panel → bottom sheet that slides up above the tab bar */
      #side-panel {
        position: fixed;
        left: 0; right: 0;
        bottom: 58px;
        top: auto;
        width: 100%;
        max-height: 52vh;
        border-right: none;
        border-top: 1px solid var(--border, #2a3050);
        border-radius: 14px 14px 0 0;
        transform: translateY(100%);
        transition: transform .28s cubic-bezier(.32,.72,0,1);
        z-index: 20;
        overflow: hidden;
      }
      #side-panel.open { transform: translateY(0); }

      /* Drag handle on the sheet */
      #side-panel::before {
        content: '';
        display: block;
        width: 36px; height: 4px;
        background: var(--border, #2a3050);
        border-radius: 2px;
        margin: .55rem auto .1rem;
        flex-shrink: 0;
      }

      .panel-close-btn { display: block !important; }
      #panel-backdrop.open { display: block; }

      /* Workspace fills remaining space */
      #workspace { touch-action: none; }

      /* Setup screen */
      #setup-screen { padding: 1rem .75rem; justify-content: flex-start; padding-top: 1.5rem; }
      #setup-screen h1 { font-size: 1.35rem; }
      .setup-card { padding: 1rem; gap: .85rem; }
    }

    @media (hover: hover) {
      .ctrl-btn:hover { background: var(--border, #2a3050); }
      .ctrl-btn.danger:hover { background: #7f1d1d; }
      #btn-start:hover { opacity: .85; }
      #btn-regen:hover { color: var(--text, #e8eaf6); }
    }
  </style>
</head>
<body>

<!-- ══════════════ ACCESS GATE ══════════════ -->
<div id="gate-screen">
  <a href="index.html" style="align-self:flex-start;display:flex;align-items:center;gap:.35rem;color:var(--muted,#7c83a8);text-decoration:none;font-size:.9rem;margin-bottom:-.25rem;">
    <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="13 4 7 10 13 16"/></svg>
    Back
  </a>
  <h1>EagleVision</h1>
  <p>Enter your host access password to continue.</p>
  <div class="setup-card" style="max-width:380px;gap:.85rem;">
    <div>
      <label for="gate-password-input">Access Password</label>
      <input id="gate-password-input" type="password" placeholder="Enter password…" autocomplete="current-password">
    </div>
    <p id="gate-error"></p>
    <button id="btn-gate-submit" class="ctrl-btn" style="background:var(--accent,#FFD700);color:#0a0f1c;font-weight:700;border:none;padding:.85rem;border-radius:10px;font-size:1rem;cursor:pointer;">Continue</button>
  </div>
</div>

<!-- ══════════════ SETUP SCREEN ══════════════ -->
<div id="setup-screen" style="display:none;">
  <a href="index.html" style="align-self:flex-start;display:flex;align-items:center;gap:.35rem;color:var(--muted,#7c83a8);text-decoration:none;font-size:.9rem;margin-bottom:-.25rem;">
    <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="13 4 7 10 13 16"/></svg>
    Back
  </a>
  <h1>Host a Session</h1>

  <div class="setup-card">
    <div>
      <label for="camera-select">Camera</label>
      <select id="camera-select"><option value="">Loading cameras…</option></select>
    </div>

    <video id="preview-video" autoplay muted playsinline></video>

    <div>
      <label for="resolution-select">Feed Quality <span style="font-weight:400;color:var(--muted,#7c83a8)">(controls what students see — always square)</span></label>
      <select id="resolution-select">
        <option value="1080x1080">High – 1080 × 1080</option>
        <option value="720x720" selected>Standard – 720 × 720</option>
        <option value="480x480">Low – 480 × 480</option>
        <option value="360x360">Very Low – 360 × 360</option>
      </select>
    </div>

    <div>
      <label>Session Code</label>
      <div class="code-row">
        <div id="session-code-display">------</div>
        <button id="btn-regen" title="New code">↺</button>
      </div>
    </div>

    <div>
      <label for="admin-key-input">Admin Key (optional)</label>
      <input id="admin-key-input" type="password" placeholder="Leave blank for open session">
    </div>

    <p id="setup-error"></p>
    <button id="btn-start">Start Session</button>
  </div>
</div>

<!-- ══════════════ SESSION SCREEN ══════════════ -->
<div id="session-screen">

  <!-- Header -->
  <div id="session-header">
    <span class="logo">EagleVision</span>
    <span id="hdr-code"></span>
    <span id="badge-socket" class="badge badge-socket err">Socket ✗</span>
    <span id="badge-lk"     class="badge badge-lk err">LiveKit ✗</span>
    <span id="hdr-viewers">0 viewers</span>
    <button id="btn-end">End Session</button>
  </div>

  <!-- Body -->
  <div id="main-layout">

    <!-- Activity bar -->
    <div id="activity-bar">
      <button class="ab-btn active" data-panel="status" title="Status">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <rect x="1" y="11" width="3" height="8" rx="1"/><rect x="6" y="7" width="3" height="12" rx="1"/>
          <rect x="11" y="3" width="3" height="16" rx="1"/><rect x="16" y="0" width="3" height="19" rx="1"/>
        </svg>
        <span class="ab-label">Status</span>
      </button>
      <button class="ab-btn" data-panel="roster" title="Roster">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <circle cx="7" cy="6" r="3"/><path d="M1 18c0-3.3 2.7-6 6-6h1" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          <circle cx="14" cy="6" r="3"/><path d="M12 12h1c3.3 0 6 2.7 6 6" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        </svg>
        <span class="ab-label">Roster</span>
      </button>
      <button class="ab-btn" data-panel="controls" title="Controls">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
          <line x1="3" y1="5" x2="17" y2="5"/><circle cx="7" cy="5" r="2.2" fill="currentColor" stroke="none"/>
          <line x1="3" y1="10" x2="17" y2="10"/><circle cx="13" cy="10" r="2.2" fill="currentColor" stroke="none"/>
          <line x1="3" y1="15" x2="17" y2="15"/><circle cx="8" cy="15" r="2.2" fill="currentColor" stroke="none"/>
        </svg>
        <span class="ab-label">Controls</span>
      </button>
    </div>

    <!-- Panel backdrop (mobile tap-to-close) -->
    <div id="panel-backdrop"></div>

    <!-- Side panel -->
    <div id="side-panel">

      <!-- Status panel -->
      <div id="panel-status" class="panel active">
        <div class="panel-title">
          Status
          <button class="panel-close-btn" onclick="closeMobilePanel()" aria-label="Close" style="display:none;background:none;border:none;color:var(--muted,#7c83a8);font-size:1.1rem;cursor:pointer;padding:0 .25rem;">✕</button>
        </div>
        <div class="panel-body" id="status-body">
          <p style="font-size:.85rem;color:var(--muted,#7c83a8)">Session is live. Waiting for students to join…</p>
        </div>
      </div>

      <!-- Roster panel -->
      <div id="panel-roster" class="panel">
        <div class="panel-title">
          Roster
          <button class="panel-close-btn" onclick="closeMobilePanel()" aria-label="Close" style="display:none;background:none;border:none;color:var(--muted,#7c83a8);font-size:1.1rem;cursor:pointer;padding:0 .25rem;">✕</button>
        </div>
        <div class="panel-body" id="roster-body"></div>
      </div>

      <!-- Controls panel -->
      <div id="panel-controls" class="panel">
        <div class="panel-title">
          Controls
          <button class="panel-close-btn" onclick="closeMobilePanel()" aria-label="Close" style="display:none;background:none;border:none;color:var(--muted,#7c83a8);font-size:1.1rem;cursor:pointer;padding:0 .25rem;">✕</button>
        </div>
        <div class="panel-body">
          <div class="ctrl-group">
            <span class="ctrl-label">Camera</span>
            <select id="session-camera-select" class="ctrl-btn" style="cursor:pointer"></select>
          </div>
          <div class="ctrl-group">
            <span class="ctrl-label">Broadcast</span>
            <button class="ctrl-btn" onclick="triggerReturnLive()">Return to Live</button>
            <button class="ctrl-btn" onclick="triggerRequestPhoto()">Request Photo</button>
            <button class="ctrl-btn" onclick="clearAllScreens()">Clear Screens</button>
          </div>
          <div class="ctrl-group">
            <span class="ctrl-label">View Mode</span>
            <button class="ctrl-btn" onclick="setFollowMode()">Follow Mode</button>
            <button class="ctrl-btn" onclick="setBroadcastMode()">Broadcast Mode</button>
          </div>
          <div class="ctrl-group">
            <span class="ctrl-label">Framing</span>
            <button id="btn-toggle-framing" class="ctrl-btn" onclick="toggleCrop()">Adjust Framing (Pan/Zoom)</button>
            <button class="ctrl-btn" onclick="resetCrop()">Reset Framing</button>
          </div>
          <div class="ctrl-group">
            <span class="ctrl-label">Instruction</span>
            <input id="instruction-input" type="text" placeholder="Type instruction…">
            <button class="ctrl-btn" onclick="sendInstruction()">Send</button>
          </div>
          <div class="ctrl-group">
            <button class="ctrl-btn" onclick="toggleFullscreen()">Fullscreen</button>
          </div>
        </div>
      </div>

    </div><!-- /side-panel -->

    <!-- Workspace -->
    <div id="workspace">
      <canvas id="host-canvas" width="720" height="720"></canvas>
    </div>

  </div><!-- /main-layout -->
</div><!-- /session-screen -->

<script src="js/socket.io.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@1.15.4/dist/livekit-client.umd.min.js"></script>
<script src="host.js"></script>
</body>
</html>
