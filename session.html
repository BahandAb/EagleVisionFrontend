<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EagleVision - Join Session</title>
    <link rel="stylesheet" href="tokens.css?v=882186bb">
    <link rel="stylesheet" href="fonts.css?v=db5611b8">
    <link rel="preload" href="assets/fonts/poppins-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/fredoka-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="style.css?v=9a164d40">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body class="landing-body">

    <a class="back-link" href="index.html">
        <span class="material-icons icon-16">arrow_back</span> HOME
    </a>

    <div class="landing-card">
        <img class="join-mascot" src="assets/ui/mascot-eagle-happy.png" alt="" width="90" height="96">
        <h1 class="logo-text"><img class="join-logo" src="assets/EagleVisionLogo.png" alt="EagleVision" width="227" height="50"></h1>
        <p class="landing-tagline">Connect to a live microscope session.</p>
        
        <div class="input-group">
            <input type="text" id="landingSessionInput" placeholder="CODE (e.g. 123456)" maxlength="8" autocomplete="off">
            <input class="landing-name-input" type="text" id="landingNameInput" placeholder="YOUR NAME" maxlength="15" autocomplete="off">
        </div>

        <div class="admin-toggle-wrap">
            <div class="admin-toggle" onclick="toggleAdminInput()">
                <span>I am the instructor.</span>
            </div>
            
            <div class="mt-10" id="adminInputDiv" style="display:none;">
                <input class="admin-input" type="password" id="landingAdminKey" placeholder="Admin Key">
            </div>
        </div>

        <button class="btn-primary" onclick="goToWorkspace()">JOIN SESSION</button>

        <p class="landing-error" id="landingError" style="display:none;"></p>
    </div>

    <script>
        function toggleAdminInput() {
            const div = document.getElementById("adminInputDiv");
            div.style.display = (div.style.display === "none") ? "block" : "none";
        }

        function goToWorkspace() {
            const code = document.getElementById("landingSessionInput").value.trim();
            const name = document.getElementById("landingNameInput").value.trim();
            const adminKey = document.getElementById("landingAdminKey").value.trim();
            const err = document.getElementById("landingError");
            const joinBtn = document.querySelector('.btn-primary');

            if (code.length < 3) {
                err.innerText = "Invalid Session Code";
                err.style.display = "block";
                return;
            }
            if (name.length < 2) {
                err.innerText = "Please enter your Name";
                err.style.display = "block";
                return;
            }

            // Show loading state
            joinBtn.disabled = true;
            joinBtn.style.opacity = '0.6';
            joinBtn.innerText = 'CONNECTING...';

            // Save Data
            sessionStorage.setItem("eagleSessionCode", code);
            sessionStorage.setItem("eagleUserName", name);
            if(adminKey) {
                sessionStorage.setItem("eagleAdminKey", adminKey); // Save key for auto-login
            }

            window.location.href = "workspace.html";
        }
        
        // Initialize on page load: auto-focus and Enter key navigation
        document.addEventListener('DOMContentLoaded', () => {
            const sessionInput = document.getElementById('landingSessionInput');
            const nameInput = document.getElementById('landingNameInput');
            
            // Auto-focus session code input
            if (sessionInput) {
                sessionInput.focus();
                sessionInput.select();
                
                // Enter key navigation: Session Code -> Name
                sessionInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        nameInput?.focus();
                    }
                });
            }
            
            // Enter key navigation: Name -> Submit
            if (nameInput) {
                nameInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        goToWorkspace();
                    }
                });
            }
        });
    </script>
<script src="sw-register.js?v=0ea6aea7" defer></script>
</body>
</html>
